version: "3.9"

services:
  rosetta-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8008:8008"
    environment:
      - ROSETTA_ROOT=/app

  rosetta-web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./rosetta-web:/app
    ports:
      - "3000:3000"
    environment:
      - ROSETTA_API_URL=http://rosetta-api:8008
    command: sh -c "npm install && npm run dev"
    depends_on:
      - rosetta-api
