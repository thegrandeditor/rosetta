[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rosetta-transpiler"
version = "2.5.0"
description = "ROSETTA Universal 32x32 Multi-Paradigm Source-to-Source Transpiler (BABEL -> HERMES -> CIPHER)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "antlr4-python3-runtime>=4.13.1",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.6.0",
    "mcp>=1.0.0",
]

[project.scripts]
rosetta = "rosetta.cli.main:main"
rosetta-mcp = "rosetta.cli.mcp_server:mcp.run"

[tool.setuptools.packages.find]
include = ["rosetta*"]
